name: Refresh AI security research evidence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run research:refresh
      - name: Open a focused evidence-review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/content/security-research-state.json; then
            echo "No evidence-state change to review."
            exit 0
          fi
          branch="automation/security-research-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/content/security-research-state.json
          git commit -m "chore: refresh AI security evidence fingerprints"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Review changed AI security evidence" --body "The daily monitor detected changes in linked official or primary evidence. Only affected dossiers have a new version and review-required status. Review the source changes before marking them verified."
