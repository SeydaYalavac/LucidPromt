name: Refresh AI security research evidence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whats-happening
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whats-happening/package-lock.json
      - run: npm ci
      - run: npm run research:refresh
      - run: npm test -- src/lib/security-research.test.ts
      - name: Publish the verified evidence state
        run: |
          if git diff --quiet -- src/content/security-research-state.json; then
            echo "Evidence state is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/security-research-state.json
          git commit -m "chore: refresh AI security evidence state"
          git pull --rebase origin main
          git push origin HEAD:main
