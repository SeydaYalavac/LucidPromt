name: Ingest live trends

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: ingest
        type: choice
        options:
          - ingest
          - archive_backfill_dry_run
          - archive_backfill_apply
      expected_archive_total:
        description: Expected eligible archive total before any write
        required: true
        default: "1845"
        type: string

concurrency:
  group: live-trend-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'schedule' || inputs.operation == 'ingest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: whats-happening
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whats-happening/package-lock.json
      - run: npm ci
      - run: npm run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_WHY_MODEL: ${{ vars.OPENAI_WHY_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          INGEST_SOURCES: ${{ vars.INGEST_SOURCES }}
          GOOGLE_TRENDS_GEOS: ${{ vars.GOOGLE_TRENDS_GEOS }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_WATCH_QUERIES: ${{ vars.X_WATCH_QUERIES }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

  archive-backfill:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'ingest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: whats-happening
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whats-happening/package-lock.json
      - run: npm ci
      - name: Calculate archive eligibility without writes
        if: ${{ inputs.operation == 'archive_backfill_dry_run' }}
        run: npm run archive:backfill -- --expected="$EXPECTED_ARCHIVE_TOTAL"
        env:
          EXPECTED_ARCHIVE_TOTAL: ${{ inputs.expected_archive_total }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Apply validated archive eligibility
        if: ${{ inputs.operation == 'archive_backfill_apply' }}
        run: npm run archive:backfill -- --apply --expected="$EXPECTED_ARCHIVE_TOTAL"
        env:
          EXPECTED_ARCHIVE_TOTAL: ${{ inputs.expected_archive_total }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
